spring:
  application:
    name: async-worker
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8085

upload:
  expire-sweep:
    interval-ms: ${UPLOAD_EXPIRE_SWEEP_INTERVAL_MS:300000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:dropbox-files}

eureka:
  client:
    enabled: false

metadata-service:
  url: ${METADATA_SERVICE_URL:http://localhost:8082}

upload-service:
  url: ${UPLOAD_SERVICE_URL:http://localhost:8083}

logging:
  pattern:
    level: "%5p [rid=%X{requestId:-} uid=%X{uploadId:-} fid=%X{fileId:-} eid=%X{eventId:-}]"

# OBS-01: minimal actuator surface for k8s probes - no detail leakage (default
# show-details: never), no new dependency (actuator already on the classpath).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

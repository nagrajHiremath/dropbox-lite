spring:
  application:
    name: upload-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:upload_db}
    username: ${DB_USER:dropbox}
    password: ${DB_PASSWORD:dropbox}
  flyway:
    enabled: false
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8083

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    enabled: true
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: localhost

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:dropbox-files}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    # Idempotency-Key reservation (IdempotencyKeyWriter.reserve) intentionally
    # provokes a unique-constraint violation (SQLState 23505) as its normal
    # race-detection signal - that case is already caught and handled at
    # DEBUG level in UploadInitiationService. Without this, Hibernate's own
    # JDBC error logger (org.hibernate.orm.jdbc.error, not the legacy
    # org.hibernate.engine.jdbc.spi.SqlExceptionHelper category) logs the raw
    # SQL exception at WARN before the exception even reaches our catch block.
    org.hibernate.orm.jdbc.error: ERROR
  pattern:
    level: "%5p [rid=%X{requestId:-} uid=%X{uploadId:-} fid=%X{fileId:-} eid=%X{eventId:-}]"

# OBS-01: minimal actuator surface for k8s probes - no detail leakage (default
# show-details: never), no new dependency (actuator already on the classpath).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# React Router uses client-side routing - any path that isn't a real static
# file must fall back to index.html, or a hard refresh on e.g. /files/abc
# would 404 at the web server instead of reaching the SPA's router.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

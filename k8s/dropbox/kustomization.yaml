# k8s/dropbox/kustomization.yaml
#
# Same secretGenerator pattern as Lovable's own k8s/kustomization.yaml - a
# .env file (gitignored, never committed - see .gitignore's blanket .env
# rule) supplies real secret values, so no secret ever lands in a committed
# manifest. Copy .env.example to .env in this directory and fill in real
# values before applying.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Namespace first
  - infra/namespace.yaml
  - infra/ingress.yaml

  # Stateful services (isolated from Lovable's - see stateful/*.yaml)
  - stateful/postgres.yaml
  - stateful/kafka.yaml
  - stateful/redis.yaml
  - stateful/minio.yaml

  # Microservices (no discovery-service - see the Eureka -> k8s DNS
  # migration discussion; services address each other directly via Service
  # DNS names)
  - services/account-service.yaml
  - services/metadata-service.yaml
  - services/upload-service.yaml
  - services/download-service.yaml
  - services/async-worker.yaml
  - services/api-gateway.yaml
  - services/dropbox-ui.yaml

# Generate dropbox-secrets from a local .env file - never committed
secretGenerator:
  - name: dropbox-secrets
    namespace: dropbox-lite
    envs:
      - .env
    behavior: create
    options:
      disableNameSuffixHash: true

replicas:
  - name: account-service
    count: 1
  - name: metadata-service
    count: 1
  - name: upload-service
    count: 1
  - name: download-service
    count: 1
  - name: async-worker
    count: 1
  - name: api-gateway
    count: 1
  - name: dropbox-ui
    count: 1

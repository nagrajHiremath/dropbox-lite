# k8s/dropbox/services/metadata-service.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-service
  namespace: dropbox-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metadata-service
  template:
    metadata:
      labels:
        app: metadata-service
    spec:
      containers:
        - name: metadata-service
          image: nagrajh/dropbox-metadata-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: metadata_db
            - name: DB_USER
              value: dropbox
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dropbox-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOST
              value: redis
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: metadata-service
  namespace: dropbox-lite
spec:
  selector:
    app: metadata-service
  ports:
    - port: 8082
      targetPort: 8082

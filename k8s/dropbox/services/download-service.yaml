# k8s/dropbox/services/download-service.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: download-service
  namespace: dropbox-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: download-service
  template:
    metadata:
      labels:
        app: download-service
    spec:
      containers:
        - name: download-service
          image: nagrajh/dropbox-download-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: REDIS_HOST
              value: redis
            - name: MINIO_ENDPOINT
              value: http://minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: dropbox-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dropbox-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BUCKET
              value: dropbox-files
            - name: METADATA_SERVICE_URL
              value: http://metadata-service:8082
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: download-service
  namespace: dropbox-lite
spec:
  selector:
    app: download-service
  ports:
    - port: 8084
      targetPort: 8084

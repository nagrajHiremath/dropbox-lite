# k8s/dropbox/services/account-service.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: dropbox-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: nagrajh/dropbox-account-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: account_db
            - name: DB_USER
              value: dropbox
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dropbox-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dropbox-secrets
                  key: JWT_SECRET
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30 # 30 * 10s = 300s max startup time
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: dropbox-lite
spec:
  selector:
    app: account-service
  ports:
    - port: 8081
      targetPort: 8081

# k8s/dropbox/stateful/minio.yaml
#
# Isolated instance/PVC/credentials, own "dropbox-files" bucket - not shared
# with Lovable's minio in lovable-core (avoids the shared-root-credential
# blast-radius issue: Lovable's MinIO has no per-service scoped IAM policy,
# so reusing it would give Dropbox full admin access to Lovable's buckets
# too, and vice versa).
#
# The one-shot bucket-creation Job mirrors docker-compose.yml's minio-init
# service (mc alias set + mc mb -p) - it retries via backoffLimit until the
# minio Service is reachable, same effect as compose's
# depends_on:{condition:service_healthy} without needing a separate wait script.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: dropbox-lite
spec:
  selector:
    matchLabels:
      app: minio
  serviceName: minio
  replicas: 1
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: [server, /data, --console-address, ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: dropbox-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dropbox-secrets
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: minio-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: dropbox-lite
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001

---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-bucket
  namespace: dropbox-lite
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: minio/mc
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: dropbox-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dropbox-secrets
                  key: MINIO_ROOT_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb -p local/dropbox-files

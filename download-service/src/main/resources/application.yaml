spring:
  application:
    name: download-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8084

eureka:
  client:
    enabled: false

metadata-service:
  url: ${METADATA_SERVICE_URL:http://localhost:8082}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:dropbox-files}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [rid=%X{requestId:-} uid=%X{uploadId:-} fid=%X{fileId:-} eid=%X{eventId:-}]"

# OBS-01: minimal actuator surface for k8s probes - no detail leakage (default
# show-details: never), no new dependency (actuator already on the classpath).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:account_db}
    username: ${DB_USER:dropbox}
    password: ${DB_PASSWORD:dropbox}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8081

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    enabled: true
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: localhost

jwt:
  secret: ${JWT_SECRET:change-me-local-dev-secret}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

storage:
  default-quota-bytes: ${DEFAULT_QUOTA_BYTES:5368709120}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

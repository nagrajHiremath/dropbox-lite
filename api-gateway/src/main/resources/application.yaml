spring:
  application:
    name: api-gateway

#app:
#  security:
#    public-routes:
#      - "/api/v1/auth/login"
#      - "/api/v1/auth/register"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          # Browser CORS - the SPA (dropbox-ui) calls this gateway directly from
          # its own origin/port (e.g. the Vite dev server), which is cross-origin
          # from the browser's perspective even though it's all localhost.
          # allowCredentials is false since auth is a Bearer token in a header,
          # not a cookie - no need for the stricter same-origin-only wildcard
          # rules credentialed CORS requires.
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: false
                maxAge: 3600
          routes:
            # RDS-03: CustomRateLimiter args grouped by TECHNICAL_DESIGN.md 44's
            # priority tiers. YAML anchors (&name / *name) avoid duplicating args
            # across the two routes each in the upload and public-share tiers.
            # Route predicates/uri/ordering are otherwise untouched. max-requests
            # carries over the old redis-rate-limiter.burstCapacity numbers as the
            # per-window cap (window-seconds: 1) - see app.rate-limit.method below
            # for which CustomRateLimiterGatewayFilterFactory backs this.
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
              filters:
                - name: CustomRateLimiter
                  args: &authRateLimit
                    max-requests: ${RATE_LIMIT_AUTH_MAX:5}
                    window-seconds: ${RATE_LIMIT_AUTH_WINDOW:1}
                    key-resolver: "#{@ipKeyResolver}"
            - id: upload-new-version
              uri: ${UPLOAD_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/files/*/uploads
              filters:
                - name: CustomRateLimiter
                  args: &uploadRateLimit
                    max-requests: ${RATE_LIMIT_UPLOAD_MAX:10}
                    window-seconds: ${RATE_LIMIT_UPLOAD_WINDOW:1}
                    key-resolver: "#{@userKeyResolver}"
            - id: download-file-content
              uri: ${DOWNLOAD_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/files/*/content,/api/v1/files/*/versions/*/content
              filters:
                - name: CustomRateLimiter
                  args:
                    max-requests: ${RATE_LIMIT_DOWNLOAD_MAX:20}
                    window-seconds: ${RATE_LIMIT_DOWNLOAD_WINDOW:1}
                    key-resolver: "#{@userKeyResolver}"
            - id: metadata-service
              uri: ${METADATA_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/files/**,/api/v1/folders/**,/api/v1/shares/**
              filters:
                - name: CustomRateLimiter
                  args:
                    max-requests: ${RATE_LIMIT_METADATA_MAX:40}
                    window-seconds: ${RATE_LIMIT_METADATA_WINDOW:1}
                    key-resolver: "#{@userKeyResolver}"
            - id: public-share-content
              uri: ${DOWNLOAD_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/public/shares/*/content
              filters:
                - name: CustomRateLimiter
                  args: &publicShareRateLimit
                    max-requests: ${RATE_LIMIT_PUBLIC_SHARE_MAX:5}
                    window-seconds: ${RATE_LIMIT_PUBLIC_SHARE_WINDOW:1}
                    key-resolver: "#{@ipKeyResolver}"
            - id: public-share-metadata
              uri: ${METADATA_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/public/shares/**
              filters:
                - name: CustomRateLimiter
                  args: *publicShareRateLimit
            - id: upload-service
              uri: ${UPLOAD_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/uploads/**
              filters:
                - name: CustomRateLimiter
                  args: *uploadRateLimit

            # Aggregated Swagger UI: each route rewrites /v3/api-docs/{service}
            # to that service's own /v3/api-docs, so the gateway's own
            # swagger-ui.html can fetch all four specs same-origin. Path
            # already starts with /v3/api-docs, which JwtAuthenticationWebFilter
            # already treats as public - no security-config changes needed.
            - id: account-service-docs
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/v3/api-docs/account-service
              filters:
                - name: RewritePath
                  args:
                    regexp: /v3/api-docs/account-service
                    replacement: /v3/api-docs
            - id: metadata-service-docs
              uri: ${METADATA_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/v3/api-docs/metadata-service
              filters:
                - name: RewritePath
                  args:
                    regexp: /v3/api-docs/metadata-service
                    replacement: /v3/api-docs
            - id: upload-service-docs
              uri: ${UPLOAD_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/v3/api-docs/upload-service
              filters:
                - name: RewritePath
                  args:
                    regexp: /v3/api-docs/upload-service
                    replacement: /v3/api-docs
            - id: download-service-docs
              uri: ${DOWNLOAD_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/v3/api-docs/download-service
              filters:
                - name: RewritePath
                  args:
                    regexp: /v3/api-docs/download-service
                    replacement: /v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: account-service
        url: /v3/api-docs/account-service
      - name: metadata-service
        url: /v3/api-docs/metadata-service
      - name: upload-service
        url: /v3/api-docs/upload-service
      - name: download-service
        url: /v3/api-docs/download-service

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-me-local-dev-secret}

# RDS-03: selects which com.dropbox.api_gateway.ratelimit.RateLimiter bean
# is active (each is @ConditionalOnProperty on this same key) - bucket,
# fixed, sliding, or sliding-lua. sliding-lua is the atomic, boundary-safe
# choice (single Lua script, no fixed-window edge burst).
app:
  rate-limit:
    method: ${RATE_LIMIT_METHOD:sliding-lua}

# OBS-01: minimal actuator surface for k8s probes - no detail leakage (default
# show-details: never), no new dependency (actuator already on the classpath).
# No logging.pattern.level/MDC here - WebFlux's reactive thread-hopping means
# ThreadLocal-based MDC doesn't reliably propagate through the chain; bridging
# Reactor Context<->MDC is out of scope for MVP (see CorrelationIdWebFilter,
# which already carries the id via the header itself, not MDC).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

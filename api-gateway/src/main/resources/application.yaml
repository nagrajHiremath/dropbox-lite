spring:
  application:
    name: api-gateway

#app:
#  security:
#    public-routes:
#      - "/api/v1/auth/login"
#      - "/api/v1/auth/register"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # RDS-03: RequestRateLimiter args grouped by TECHNICAL_DESIGN.md 44's
            # priority tiers. YAML anchors (&name / *name) avoid duplicating args
            # across the two routes each in the upload and public-share tiers.
            # Route predicates/uri/ordering are otherwise untouched.
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
              filters:
                - name: RequestRateLimiter
                  args: &authRateLimit
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_AUTH_REPLENISH:3}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_AUTH_BURST:5}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"
            - id: upload-new-version
              uri: lb://upload-service
              predicates:
                - Path=/api/v1/files/*/uploads
              filters:
                - name: RequestRateLimiter
                  args: &uploadRateLimit
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_UPLOAD_REPLENISH:5}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_UPLOAD_BURST:10}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: download-file-content
              uri: lb://download-service
              predicates:
                - Path=/api/v1/files/*/content,/api/v1/files/*/versions/*/content
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_DOWNLOAD_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_DOWNLOAD_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: metadata-service
              uri: lb://metadata-service
              predicates:
                - Path=/api/v1/files/**,/api/v1/folders/**,/api/v1/shares/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_METADATA_REPLENISH:20}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_METADATA_BURST:40}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: public-share-content
              uri: lb://download-service
              predicates:
                - Path=/api/v1/public/shares/*/content
              filters:
                - name: RequestRateLimiter
                  args: &publicShareRateLimit
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_PUBLIC_SHARE_REPLENISH:3}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_PUBLIC_SHARE_BURST:5}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"
            - id: public-share-metadata
              uri: lb://metadata-service
              predicates:
                - Path=/api/v1/public/shares/**
              filters:
                - name: RequestRateLimiter
                  args: *publicShareRateLimit
            - id: upload-service
              uri: lb://upload-service
              predicates:
                - Path=/api/v1/uploads/**
              filters:
                - name: RequestRateLimiter
                  args: *uploadRateLimit

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:change-me-local-dev-secret}

# OBS-01: minimal actuator surface for k8s probes - no detail leakage (default
# show-details: never), no new dependency (actuator already on the classpath).
# No logging.pattern.level/MDC here - WebFlux's reactive thread-hopping means
# ThreadLocal-based MDC doesn't reliably propagate through the chain; bridging
# Reactor Context<->MDC is out of scope for MVP (see CorrelationIdWebFilter,
# which already carries the id via the header itself, not MDC).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
